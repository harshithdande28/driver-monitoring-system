# Central configuration for the Driver Monitoring System.
# Every notebook and script reads from here, so a value is only changed in one place.

seed: 42

paths:
  drive_root: /content/drive/MyDrive/driver-monitoring   # permanent storage (Google Drive)
  local_data: /content/data/statefarm                     # fast local disk in Colab
  splits_file: /content/drive/MyDrive/driver-monitoring/data/splits.csv

data:
  kaggle_competition: state-farm-distracted-driver-detection
  zip_name: state-farm-distracted-driver-detection.zip
  val_fraction: 0.15        # fraction of DRIVERS (not images) held out for validation
  test_fraction: 0.15       # fraction of DRIVERS held out for testing
  split_search_trials: 2000 # random driver splits tried; the most class-balanced one is kept

train:
  image_size: 224
  batch_size: 64
  num_workers: 2            # Colab free tier has 2 CPU cores
  label_smoothing: 0.1
  weight_decay: 0.01        # AdamW
  early_stopping_patience: 3
  smoke_fraction: 0.01      # share of data used by the smoke test
  models:
    baseline:               # small CNN from scratch — the reference number
      pretrained: false
      head_epochs: 0
      finetune_epochs: 15
      lr_finetune: 0.001
    efficientnet_b0:        # main model
      pretrained: true
      head_epochs: 2        # phase 1: backbone frozen, train the classifier head
      finetune_epochs: 10   # phase 2: everything unfrozen
      lr_head: 0.001
      lr_finetune: 0.0003
    mobilenet_v3_large:     # lightweight model for the laptop / edge
      pretrained: true
      head_epochs: 2
      finetune_epochs: 10
      lr_head: 0.001
      lr_finetune: 0.0003

drowsiness:
  calibration_seconds: 15     # sit normally, eyes open, looking at the road
  eye_closed_ratio: 0.70      # eyes "closed" when EAR < 70% of your own open-eye EAR
  microsleep_seconds: 1.5     # continuous closure that counts as a microsleep (critical)
  perclos_window_seconds: 60  # rolling window for PERCLOS
  perclos_min_seconds: 10     # need this much data before PERCLOS is trusted
  perclos_drowsy: 0.15        # eyes closed >15% of the time -> drowsy
  perclos_min_closure_seconds: 0.4   # closures shorter than this are normal blinks (ignored)
  yawn_mar_min: 0.50          # mouth-open threshold is max(this, baseline + yawn_mar_margin)
  yawn_mar_margin: 0.35
  yawn_min_seconds: 1.0       # longer than talking
  yawn_window_seconds: 180
  yawns_drowsy: 3             # yawns within the window -> drowsy
  look_away_yaw_deg: 25       # head turned left/right beyond your baseline
  look_away_pitch_deg: 20     # head tilted up/down beyond your baseline
  look_away_seconds: 2.0      # sustained -> distracted (eyes off road)
  nod_pitch_deg: 15
  nod_min_seconds: 0.2
  nod_max_seconds: 1.5
  nod_window_seconds: 60
  nods_drowsy: 2

monitor:
  model_file: models/distraction_fp32.onnx   # model_meta.json deploy_file takes priority
  classify_every_n_frames: 2   # run the classifier on every 2nd frame (face tracking runs on all)
  smoothing_seconds: 1.0       # average classifier probabilities over this window
  distraction_threshold: 0.70  # smoothed P(distracted) needed (probabilities are calibrated)
  distraction_seconds: 2.0     # ...for this long before the driver counts as distracted
  # sound alerts
  distracted_repeat_seconds: 4.0   # soft chime repeats while distracted
  drowsy_beep_seconds: 5.0         # beep repeats while drowsy
  drowsy_speech_seconds: 30.0      # spoken warning at most this often
  drowsy_message: "You seem tired. Please take a break."
  trips_dir: trips

classes:
  c0: safe driving
  c1: texting - right
  c2: talking on the phone - right
  c3: texting - left
  c4: talking on the phone - left
  c5: operating the radio
  c6: drinking
  c7: reaching behind
  c8: hair and makeup
  c9: talking to passenger
